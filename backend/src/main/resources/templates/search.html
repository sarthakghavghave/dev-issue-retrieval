<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <title>Developer Issue Retrieval</title>
</head>

<body>
<div th:replace="fragments/navbar :: mainNavbar"></div>

<div class="container">
    <div class="hero">
        <h1>Developer Issue Retrieval</h1>
        <p>
            Search semantically across thousands of GitHub issues
            using embeddings and reranking.
        </p>
    </div>

    <div class="stats">
        <div class="stat-card" id="issuesStat" title="The vector search space includes live indexed GitHub issues." data-tooltip="The vector search space includes live indexed GitHub issues.">
            <div class="stat-value" id="issuesValue">—</div>
            <div class="stat-label">Issues Indexed</div>
        </div>

        <div class="stat-card" id="reposStat" title="Search covers live repositories stored in the issue index." data-tooltip="Search covers live repositories stored in the issue index.">
            <div class="stat-value" id="reposValue">—</div>
            <div class="stat-label">Repositories</div>
        </div>

        <div class="stat-card" id="lastUpdateStat" title="Last time the incremental ingestion ran and refreshed the index." data-tooltip="Last time the incremental ingestion ran and refreshed the index.">
            <div class="stat-value" id="lastUpdateValue">—</div>
            <div class="stat-label">Last Ingestion</div>
        </div>

        <div class="stat-card" title="FAISS is used for fast semantic retrieval over issue embeddings." data-tooltip="FAISS is used for fast semantic retrieval over issue embeddings.">
            <div class="stat-value">FAISS</div>
            <div class="stat-label">Semantic Retrieval</div>
        </div>

        <div class="stat-card" title="A TinyBERT cross-encoder reranks the top candidates for best relevance." data-tooltip="A TinyBERT cross-encoder reranks the top candidates for best relevance.">
            <div class="stat-value">Cross Encoder</div>
            <div class="stat-label">Reranking</div>
        </div>
    </div>

    <div class="search-container">
        <div class="search-input-wrapper">
            <span class="search-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input
                    id="query"
                    placeholder="Describe your issue (e.g., 'Kafka consumer group partition lag issues' or 'Spring Boot HikariCP connection timeout')..."
            >
            <span class="search-shortcut">
                <kbd>Enter</kbd>
            </span>
        </div>

        <button onclick="search()" class="btn-search">
            <span>Search</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </div>

    <div class="filters">
        <select id="repoFilter">
            <option value="">All Repositories</option>
        </select>

        <select id="sortFilter">
            <option value="relevance">Best Match</option>
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
        </select>
    </div>

    <div id="loading" class="loading"></div>
    <div id="resultCount"></div>
    <div id="results"></div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button id="closeModal" class="close-btn">&times;</button>

        <div class="modal-header">
            <h2 id="modalTitle"></h2>
            <div class="modal-meta">
                <span id="modalRepo" class="repo-badge-modal"></span>
                <span id="modalDate" class="date-badge"></span>
            </div>
        </div>

        <div id="modalLabels" class="modal-labels"></div>

        <div class="modal-body-section">
            <h3>Description</h3>
            <p id="modalBody" class="modal-body-text"></p>
        </div>

        <div class="modal-footer">
            <a id="modalLink" class="btn-github" target="_blank" rel="noopener noreferrer">
                🔗 Open on GitHub
            </a>
        </div>
    </div>
</div>

<script>

    async function search() {

        const loading = document.getElementById("loading");
        loading.innerHTML = "Searching...";

        const query = document.getElementById("query").value || "";
        if (!query.trim()) {
            loading.innerHTML = "";
            document.getElementById('resultCount').innerText = "Please enter a search query.";
            return;
        }

        const response = await fetch("/api/search?query=" + encodeURIComponent(query));
        const repo = document.getElementById("repoFilter").value;
        const sort = document.getElementById("sortFilter").value;

        const data = await response.json();
        loading.innerHTML = "";
        const container = document.getElementById("results");
        container.innerHTML = "";

        let filtered = data || [];

        if(repo){
            filtered = filtered.filter(
                x => x.repository === repo
            );
        }

        if(sort === "newest"){
            filtered.sort(
                (a,b) =>
                new Date(b.created_at) -
                new Date(a.created_at)
            );
        }

        if(sort === "oldest"){
            filtered.sort(
                (a,b) =>
                new Date(a.created_at) -
                new Date(b.created_at)
            );
        }

        document.getElementById('resultCount').innerText = `${filtered.length} results`;

        if(filtered.length === 0){
            container.innerHTML = '<div class="result-card">No results found. Try a different query or remove filters.</div>';
            return;
        }

        filtered.forEach(item => {
            const preview = item.body ? (item.body.length > 300 ? item.body.substring(0,300) + '...' : item.body) : 'No description available';

            // Escape potential backticks in the serialized JSON for safe inlining
            const safeItem = JSON.stringify(item).replace(/`/g, '\\`');

            container.innerHTML += `

            <div class="result-card" onclick='showModal(${safeItem})'>
                <div class="result-header">
                    <div class="result-title">
                        ${item.title}
                    </div>

                    <div class="relevance">
                        ${item.relevance}
                    </div>
                </div>

                <div class="repo-badge">
                    ${item.repository}
                </div>

                <div class="labels">
                    ${item.labels
                        ? item.labels.split(",")
                            .map(label => `<span class="tag">${label}</span>`)
                            .join("")
                        : ""
                    }
                </div>

                <div class="date">
                    Opened ${item.created_at}
                </div>

                <div class="preview">
                    ${preview}
                </div>

                <a
                    class="open-link"
                    href="${item.url}"
                    target="_blank">

                    View GitHub Issue →

                </a>
            </div>
            `;
        });
    }

    function showModal(result){
        document.getElementById("modalTitle").innerText = result.title || 'No title';
        document.getElementById("modalRepo").innerText = result.repository || 'Unknown Repository';
        document.getElementById("modalDate").innerText = "Opened: " + (result.created_at || 'unknown');

        // Display full body with line breaks
        const bodyText = (result.body || 'No description available').trim();
        document.getElementById("modalBody").innerHTML = bodyText
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n/g, '<br>');

        document.getElementById("modalLink").href = result.url || '#';
        document.getElementById("modalLink").innerText = '🔗 Open on GitHub';
        document.getElementById("modal").style.display = "block";

        // Display labels with better styling
        const labelsHtml = result.labels ? result.labels
            .split(",")
            .filter(label => label.trim())
            .map(label => `<span class="tag">${label.trim()}</span>`)
            .join("") : "<span class='tag-empty'>No labels</span>";
        document.getElementById("modalLabels").innerHTML = labelsHtml || '';

        // Close on background click
        document.getElementById("modal").onclick = (e) => {
            if(e.target.id === 'modal') {
                document.getElementById("modal").style.display = "none";
            }
        };
    }

    document.getElementById("closeModal").onclick = () => {
        document.getElementById("modal").style.display = "none";
    };

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') {
            document.getElementById("modal").style.display = "none";
        }
    });

    function setQuery(text) {
        const input = document.getElementById('query');
        input.value = text;
        search();
    }

    // allow Enter to trigger search
    const queryInput = document.getElementById('query');
    if(queryInput){
        queryInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') search(); });
    }

    // --- Live stats: pull real-time issue & repository counts from the backend ---
    async function refreshStats() {
        try {
            const response = await fetch("/api/stats", { cache: "no-store" });
            if (!response.ok) throw new Error("Stats endpoint returned " + response.status);
            const data = await response.json();

            const issuesEl = document.getElementById("issuesValue");
            const reposEl = document.getElementById("reposValue");
            const lastEl = document.getElementById("lastUpdateValue");

            if (issuesEl && typeof data.issueCount === "number") {
                issuesEl.innerText = data.issueCount.toLocaleString();
            }
            if (reposEl && typeof data.repositoryCount === "number") {
                reposEl.innerText = data.repositoryCount.toLocaleString();
            }
            if (lastEl && data.lastIngestionAt) {
                const suffix = data.schedulerRunning ? " (in progress)" : "";
                lastEl.innerText = data.lastIngestionAt.replace("T", " ") + suffix;
            }

            const repoFilter = document.getElementById("repoFilter");
            if (repoFilter && data.repositoryNames && data.repositoryNames.length > 0) {
                if (repoFilter.options.length <= 1) {
                    const currentValue = repoFilter.value;
                    repoFilter.innerHTML = '<option value="">All Repositories</option>';
                    data.repositoryNames.forEach(repoName => {
                        const option = document.createElement("option");
                        option.value = repoName;
                        let displayName = repoName;
                        if (repoName.includes("/")) {
                            const parts = repoName.split("/");
                            const project = parts[1];
                            displayName = project.split("-")
                                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                                .join(" ");
                        } else {
                            displayName = repoName.split("-")
                                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                                .join(" ");
                        }
                        option.textContent = displayName;
                        repoFilter.appendChild(option);
                    });
                    repoFilter.value = currentValue;
                }
            }

            const issuesCard = document.getElementById("issuesStat");
            if (issuesCard) {
                issuesCard.setAttribute(
                    "title",
                    `The vector search space includes ${data.issueCount} indexed GitHub issues (live).`
                );
                issuesCard.setAttribute(
                    "data-tooltip",
                    `The vector search space includes ${data.issueCount} indexed GitHub issues (live).`
                );
            }
            const reposCard = document.getElementById("reposStat");
            if (reposCard) {
                reposCard.setAttribute(
                    "title",
                    `Search covers ${data.repositoryCount} repositories stored in the issue index (live).`
                );
                reposCard.setAttribute(
                    "data-tooltip",
                    `Search covers ${data.repositoryCount} repositories stored in the issue index (live).`
                );
            }
        } catch (err) {
            console.warn("Could not refresh stats:", err);
        }
    }

    refreshStats();
    setInterval(refreshStats, 30000);
</script>

</body>
</html>
