spring.application.name=dev-issue-retrieval
spring.profiles.active=local

retrieval.api.url= ${RETRIEVAL_API_URL}
retrieval.api.update-url=${RETRIEVAL_API_UPDATE_URL}

# Incremental ingestion schedule (every 6 hours by default; override via env/property)
issue.ingestion.fixed-rate=21600000
issue.ingestion.initial-delay=60000