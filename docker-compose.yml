version: "3.9"

services:

  nlp-service:
    build: ./nlp-service
    container_name: nlp-service
    ports:
      - "8000:8000"

  spring-app:
    build: ./backend
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      - nlp-service
    environment:
      - RETRIEVAL_API_URL=http://nlp-service:8000/search
      - RETRIEVAL_API_UPDATE_URL=http://nlp-service:8000/update-index